<p align="center" size="44">Orang-Bati</p>
<p>The orang-bati is a winged cryptid that according to local folklore<br>
inhabits the Indonesian island of Seram.</p>
<p>The appearance of the creature is a cross between and monkey<br>
and bat. It is said to abduct children, before flying to Mount<br>
Kairatu in order to eat them.</p>
