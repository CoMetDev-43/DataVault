<p align="center" size="44">Light Emitting Diode</p>
<p>A light-emitting diode ( LED ) is a two-lead semiconductor light<br>
source that emits light when voltage is applied.</p>
<p>The light is produced when electrons recombine with electron<br>
holes inside the device and release energy as photons, this effect is<br>
called electroluminescence.</p>
